name: Validate, build, and publish BurnCloud Entry Point Atlas

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/deploy-docusaurus.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/deploy-docusaurus.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burncloud-entrypoint-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Atlas repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify focused documentation tree
        run: |
          test -f docs/index.md
          test -f docs/http-api/ai-api-data-plane/get-v1-models.md
          test -f site/sidebars.js
          test "$(find docs -type f -name '*.md' | wc -l)" -eq 2
          test ! -d content
          test ! -d docs/commits
          test ! -f docs/commit-index.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: {node-version: 20}

      - name: Install Docusaurus
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build Docusaurus site
        working-directory: site
        run: npm run build

      - name: Verify focused output
        run: |
          test -f site/build/index.html
          test -f site/build/http-api/ai-api-data-plane/get-v1-models/index.html
          test ! -e site/build/changes
          test ! -e site/build/api-requests
          test ! -e site/build/account
          test ! -e site/build/console
          test ! -e site/build/operator

      - name: Replace Pages output with current build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' \
            ! -name 'docs' ! -name 'site' \
            ! -name 'README.md' ! -name '.gitignore' \
            -exec rm -rf {} +
          cp -a site/build/. .
          touch .nojekyll

      - name: Commit Pages output to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish BurnCloud GET /v1/models E2E Atlas [skip ci]"
          git push origin HEAD:main
