name: Validate, build, and publish Docusaurus Runtime Atlas
on:
  pull_request:
    paths: ['content/**','site/**','tools/**','.github/workflows/deploy-docusaurus.yml']
  push:
    branches: [main]
    paths: ['content/**','site/**','tools/**','.github/workflows/deploy-docusaurus.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: docusaurus-runtime-atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Runtime Atlas repository
        uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Checkout current BurnCloud source
        uses: actions/checkout@v4
        with:
          repository: burncloud/burncloud
          ref: main
          path: .source/burncloud
      - name: Normalize legacy hash links to native Docusaurus routes
        run: node site/scripts/normalize-doc-links.js
      - name: Validate User Flow tree, drill-down links, Mermaid size, and dynamic boundaries
        run: python3 tools/validate_runtime_icfg_atlas.py
      - name: Validate all Source Evidence against current BurnCloud main
        run: python3 tools/validate_source_evidence.py .source/burncloud
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Install Docusaurus
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build Docusaurus with Mermaid
        working-directory: site
        run: npm run build
      - name: Verify critical progressive drill-down output
        run: |
          test -f site/build/index.html
          test -f site/build/api-requests/chat-completion/index.html
          test -f site/build/api-requests/chat-completion/channel-selection/index.html
          test -f site/build/api-requests/chat-completion/provider-execution/index.html
      - name: Replace legacy Pages output with Docusaurus build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' ! -name '.github' ! -name '.source' \
            ! -name 'content' ! -name 'site' ! -name 'tools' \
            ! -name 'README.md' ! -name '.gitignore' \
            -exec rm -rf {} +
          cp -a site/build/. .
          touch .nojekyll
          rm -rf .source
      - name: Commit generated Pages output to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Docusaurus Runtime Atlas [skip ci]"
          git push origin HEAD:main
